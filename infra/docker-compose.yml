# ============================================================================
# OreBase worker fleet — EC2 t3.medium (Docker Compose)
#
# Secrets come from AWS SSM Parameter Store on the box, NOT a committed .env.
# The `env_file` line is a local-dev convenience only.
#
# Historical SEDAR+ backfill is NOT a service here. Run it by hand with
# `uv run python -m sedar.backfill --confirm-backfill --slice ...` after the
# product is trusted. See workers/sedar/NOTES.md.
# ============================================================================

x-worker-base: &worker-base
  build:
    context: ../workers
    dockerfile: Dockerfile
  # env_file: ../workers/.env
  restart: always
  environment:
    CLOUDWATCH_METRICS: "1"

services:
  edgar-poller:
    <<: *worker-base
    command: >
      sh -c "while true; do uv run python edgar_poller.py --limit 50; sleep 900; done"

  newswire-poller:
    <<: *worker-base
    command: >
      sh -c "while true; do uv run python newswire_poller.py --limit 25; sleep 600; done"

  sedar-incremental:
    <<: *worker-base
    command: >
      sh -c "while true; do uv run python -m sedar.incremental --nightly --limit 20; sleep 28800; done"
    volumes:
      - sedar_profile:/root/.sedar_profile

  processor:
    <<: *worker-base
    command: ["uv", "run", "python", "processor.py"]

  extractor:
    <<: *worker-base
    command: ["uv", "run", "python", "extractor.py"]

  alerts:
    <<: *worker-base
    command: >
      sh -c "while true; do uv run python alerts.py --once; sleep 300; done"

  healthcheck:
    <<: *worker-base
    command: >
      sh -c "while true; do uv run python healthcheck.py; sleep 3600; done"

volumes:
  sedar_profile:
