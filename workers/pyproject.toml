[project]
name = "orebase-workers"
version = "0.1.0"
description = "OreBase ingestion and processing workers (EDGAR poller + PDF processor)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "playwright>=1.44",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "voyageai>=0.2",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
