[project]
name = "orebase-workers"
version = "0.1.0"
description = "OreBase ingestion and processing workers (EDGAR, processor, extractor, SEDAR+, newswires, alerts)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "playwright>=1.44",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "voyageai>=0.2",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv]
package = false
