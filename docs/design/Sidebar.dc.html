<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OreBase sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ob-nav:hover{background:#171B21;color:#E8EBEF}
.ob-pulse{animation:obpulse 2.2s ease-in-out infinite}
@keyframes obpulse{0%,100%{box-shadow:0 0 0 0 rgba(79,196,138,.55)}50%{box-shadow:0 0 0 5px rgba(79,196,138,0)}}
@media (prefers-reduced-motion:reduce){.ob-pulse{animation:none}}
</style>
</helmet>
<nav aria-label="Main" style="box-sizing: border-box; width: 100%; height: 100%; min-height: 1000px; background: #0E1115; border-right: 1px solid #1E232B; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif; color: #E8EBEF">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px; color: #E8EBEF">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 25 8.5v11L14 26 3 19.5v-11z" fill="none" stroke="#E0985A" stroke-width="1.6"></path><path d="M3 12.5 14 19l11-6.5M3 16 14 22.5 25 16" fill="none" stroke="#E0985A" stroke-width="1.2" opacity="0.55"></path><circle cx="14" cy="11" r="2.4" fill="#E0985A"></circle></svg>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em">OreBase</span>
  </a>

  <button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; background: #13171C; border: 1px solid #242A33; border-radius: 10px; color: #9AA3AE; font: 500 13px Inter, sans-serif; cursor: pointer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"></path></svg>
    <span style="flex: 1; text-align: left">Search or ask…</span>
    <span style="font: 500 11px 'JetBrains Mono', monospace; color: #7C8591; border: 1px solid #2A313B; border-radius: 5px; padding: 2px 6px">⌘K</span>
  </button>

  <sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7C8591; padding: 0 10px 6px">{{group.label}}</div>
      <sc-for list="{{group.items}}" as="item" hint-placeholder-count="4">
        <a class="ob-nav" href="{{item.href}}" style="{{item.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
          <span style="flex: 1">{{item.label}}</span>
          <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}">
            <span class="num" style="font: 500 11px 'JetBrains Mono', monospace; background: #2A1E14; color: #F2B27C; border-radius: 999px; padding: 1px 7px">{{item.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7C8591; padding: 0 10px 6px">Recent chats</div>
    <a class="ob-nav" href="Chat.dc.html" style="display: block; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: #9AA3AE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">BC copper resources since Sept</a>
    <a class="ob-nav" href="Chat.dc.html" style="display: block; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: #9AA3AE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lithium PEAs with IRR above 25%</a>
    <a class="ob-nav" href="Chat.dc.html" style="display: block; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: #9AA3AE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Who are the QPs on Ontario gold PFSs?</a>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <a href="Admin.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #11161B; border: 1px solid #1F2A25; border-radius: 10px; color: #B7C0CA; font-size: 12px">
      <span class="ob-pulse" style="width: 8px; height: 8px; border-radius: 999px; background: #4FC48A; flex: none"></span>
      <span style="flex: 1; line-height: 1.35">Ingestion live<br><span style="color: #7C8591">EDGAR synced 12 min ago</span></span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <span style="width: 32px; height: 32px; border-radius: 999px; background: #2A1E14; color: #F2B27C; display: grid; place-items: center; font: 600 13px Inter, sans-serif">A</span>
      <span style="flex: 1; font-size: 13px; line-height: 1.3">Alex<br><span style="color: #7C8591; font-size: 12px">Admin</span></span>
      <button type="button" aria-label="Settings" style="width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: #7C8591; cursor: pointer; display: grid; place-items: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </button>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","chat","screener","watchlist","research","companies","documents","admin","review"],"default":"home"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const base = 'display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 10px; border-radius: 8px; font-size: 14px; font-weight: 500; ';
    const on = base + 'background: #1C1712; color: #F2B27C; box-shadow: inset 2px 0 0 #E0985A;';
    const off = base + 'color: #9AA3AE;';
    const mk = (key, label, href, d, badge) => ({
      label, href, d, badge: badge || '', hasBadge: Boolean(badge),
      style: key === active ? on : off
    });
    return {
      groups: [
        { label: 'Intelligence', items: [
          mk('home', 'Home', 'Main.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'),
          mk('chat', 'Chat', 'Chat.dc.html', 'M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z'),
          mk('screener', 'Screener', 'Screener.dc.html', 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4'),
          mk('watchlist', 'Watchlist', 'Watchlist.dc.html', 'M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z', '7'),
          mk('research', 'Research', 'Research.dc.html', 'M3 3v18h18M7 15l4-4 3 3 5-6')
        ]},
        { label: 'Corpus', items: [
          mk('companies', 'Companies', 'Company.dc.html', 'M4 21V5l8-2v18M12 9h8v12M3 21h18'),
          mk('documents', 'Documents', 'Documents.dc.html', 'M14 3H6v18h12V7zM14 3v4h4M9 13h6M9 17h6')
        ]},
        { label: 'Operations', items: [
          mk('admin', 'Pipeline', 'Admin.dc.html', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'),
          mk('review', 'Review queue', 'Review.dc.html', 'M4 4h16v16H4zM8 12l3 3 5-6', '42')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
